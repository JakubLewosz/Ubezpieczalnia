[project]
name = "broker-office"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<4", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6", "pypdf>=6,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<13",
  "openpyxl>=3.1,<4", "gunicorn>=23,<26", "python-dotenv>=1,<2", "reportlab>=4,<5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "ruff>=0.12,<1", "pip-licenses>=5,<6"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ocr: real local Tesseract integration (requires pol+eng)"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
